name: Verify patched partner-gallery dependencies

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/verify-dependencies.yml
      - app/package.json
      - app/tests/dependency-boundary.test.mjs

permissions:
  contents: write

jobs:
  verify-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile from committed manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Contracts
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: pin verified partner-gallery dependencies'
          git push origin HEAD:portfolio-improvements-2026-08
